name: Guided dialogue validation

on:
  push:
    paths:
      - 'firmware/esp32/web/**'
      - 'firmware/esp32/tests/**'
      - 'design/diagnostics/**'
      - 'design/engine-build/**'
      - 'design/education/**'
      - 'design/research/**'
      - 'design/ini/**'
      - 'tools/ini_research_scan.py'
      - 'tools/tests/test_ini_research_scan.py'
      - 'docs/42-proteus-f7-generated-ini-deep-audit.md'
      - 'docs/40-verified-external-source-ledger-and-rusefi-constraints.md'
      - 'docs/41-implementation-readiness-decisions-and-traceability.md'
      - 'prototype/esp_education_core.*'
      - 'docs/36-seth-complete-teaching-and-tuning-master-spec.md'
      - 'docs/37-seth-education-screen-and-dialogue-flows.md'
      - 'docs/38-esp-resident-education-runtime-architecture.md'
      - 'docs/39-seth-end-to-end-acceptance-and-coverage-gates.md'
      - 'prototype/engine-profile-policy.mjs'
      - 'docs/33-unified-tuning-coordinator.md'
      - 'docs/34-engine-build-archive-and-seth-intake.md'
      - 'docs/30-seth-diagnostic-agent-master-plan.md'
      - 'docs/31-seth-high-rate-capture-and-evidence-spec.md'
      - 'docs/32-seth-diagnostic-case-ux-and-reasoning-flows.md'
      - 'firmware/esp32/tools/**'
      - 'docs/24-seth-complete-dialogue.md'
      - 'docs/28-seth-chapter-questions.md'
      - '.github/workflows/guided-dialogue-checks.yml'
  pull_request:
    paths:
      - 'firmware/esp32/web/**'
      - 'firmware/esp32/tests/**'
      - 'design/diagnostics/**'
      - 'design/engine-build/**'
      - 'design/education/**'
      - 'design/research/**'
      - 'design/ini/**'
      - 'tools/ini_research_scan.py'
      - 'tools/tests/test_ini_research_scan.py'
      - 'docs/42-proteus-f7-generated-ini-deep-audit.md'
      - 'docs/40-verified-external-source-ledger-and-rusefi-constraints.md'
      - 'docs/41-implementation-readiness-decisions-and-traceability.md'
      - 'prototype/esp_education_core.*'
      - 'docs/36-seth-complete-teaching-and-tuning-master-spec.md'
      - 'docs/37-seth-education-screen-and-dialogue-flows.md'
      - 'docs/38-esp-resident-education-runtime-architecture.md'
      - 'docs/39-seth-end-to-end-acceptance-and-coverage-gates.md'
      - 'prototype/engine-profile-policy.mjs'
      - 'docs/33-unified-tuning-coordinator.md'
      - 'docs/34-engine-build-archive-and-seth-intake.md'
      - 'docs/30-seth-diagnostic-agent-master-plan.md'
      - 'docs/31-seth-high-rate-capture-and-evidence-spec.md'
      - 'docs/32-seth-diagnostic-case-ux-and-reasoning-flows.md'
      - 'firmware/esp32/tools/**'
      - 'docs/24-seth-complete-dialogue.md'
      - 'docs/28-seth-chapter-questions.md'
      - '.github/workflows/guided-dialogue-checks.yml'

jobs:
  browser-guide-host-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware/esp32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript unit and dialogue link tests
        run: node --test tests/*.test.mjs
      - name: Regenerate ESP embedded browser assets
        run: python3 tools/generate_web_assets.py
      - name: Host-side C syntax checks
        run: bash tests/run_host_syntax.sh
      - name: Validate embedded static assets
        run: bash tests/run_assets_host.sh
      - name: Compile and test bounded ESP-compatible C education state
        run: bash tests/run_education_host.sh
      - name: Test read-only generated INI research scanner
        run: python3 -m unittest discover -s ../../tools/tests -p 'test_ini_research_scan.py'
